<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monolith — Hero Lattice</title>
  <meta name="description" content="Hero section with a 4x4 ring of tiles rotating clockwise behind a blend-mode wordmark.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,900&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="stage">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Monolith, home">Monolith<span class="dot"></span></a>
      <button class="menu-btn" aria-label="Open menu"><i></i><i></i><i></i><i></i></button>
    </header>

    <!--
      Ring order is clockwise from top-left:
      top row L->R, right column top->bottom, bottom row R->L, left column bottom->top.
      The inner 2x2 stays empty - that hollow is what the wordmark reads through.

        0   1   2   3
        11  .   .   4
        10  .   .   5
        9   8   7   6
    -->
    <div class="ring" aria-hidden="true">
      <div class="cell" style="grid-area:1/1"><div class="tile"><div class="plate p1"></div></div></div>
      <div class="cell" style="grid-area:1/2"><div class="tile"><div class="plate p2"></div></div></div>
      <div class="cell" style="grid-area:1/3"><div class="tile"><div class="plate p3"></div></div></div>
      <div class="cell" style="grid-area:1/4"><div class="tile"><div class="plate p4"></div></div></div>
      <div class="cell" style="grid-area:2/4"><div class="tile"><div class="plate p5"></div></div></div>
      <div class="cell" style="grid-area:3/4"><div class="tile"><div class="plate p6"></div></div></div>
      <div class="cell" style="grid-area:4/4"><div class="tile"><div class="plate p7"></div></div></div>
      <div class="cell" style="grid-area:4/3"><div class="tile"><div class="plate p8"></div></div></div>
      <div class="cell" style="grid-area:4/2"><div class="tile"><div class="plate p9"></div></div></div>
      <div class="cell" style="grid-area:4/1"><div class="tile"><div class="plate p10"></div></div></div>
      <div class="cell" style="grid-area:3/1"><div class="tile"><div class="plate p11"></div></div></div>
      <div class="cell" style="grid-area:2/1"><div class="tile"><div class="plate p12"></div></div></div>
    </div>

    <div class="wordmark-layer">
      <span class="copyright">&copy;</span>
      <span class="wordmark-clip">
        <h1 class="wordmark">
          <span style="--d:.10s">M</span><span style="--d:.15s">O</span><span style="--d:.20s">N</span><span style="--d:.25s">O</span><span style="--d:.30s">L</span><span style="--d:.35s">I</span><span style="--d:.40s">T</span><span style="--d:.45s">H</span>
        </h1>
      </span>
    </div>

    <div class="bottombar">
      <nav class="corner left" aria-label="Social">
        <a class="chip" href="#" aria-label="Instagram">IG</a>
        <a class="chip" href="#" aria-label="X">X</a>
        <button class="chip pause" type="button" aria-pressed="false" aria-label="Pause the ring">&#8214;</button>
      </nav>

      <a class="cta" href="#">
        <span class="arrow" aria-hidden="true">&#8599;</span>
        <span class="roll"><span>Get in touch</span><span>Get in touch</span></span>
        <span class="arrow" aria-hidden="true">&#8599;</span>
      </a>

      <nav class="corner right" aria-label="Portfolios">
        <a class="chip" href="#" aria-label="Behance">B&#275;</a>
        <a class="chip" href="#" aria-label="Dribbble">Dr</a>
      </nav>
    </div>
  </main>

  <script src="ring.js"></script>
</body>
</html>

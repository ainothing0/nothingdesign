<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment — Image Sphere</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,900&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">

<style>
  :root{
    --paper:#fafafa;
    --ink:#141414;
    --stone-2:#a9a49c;
    --stone-3:#6b6762;
    --hair:rgba(20,20,20,.14);
    --font-display:"Archivo","Arial Black",Arial,sans-serif;
    --font-sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-mono:"DM Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-sans);
  }

  .topbar{
    position:absolute;
    inset:24px 24px auto 24px;
    z-index:6;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    font-family:var(--font-display);
    font-weight:900;
    font-size:15px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink);
    text-decoration:none;
  }
  .tag{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--stone-3);
    border:1px solid var(--hair);
    border-radius:999px;
    padding:5px 12px;
  }

  .stage{
    position:relative;
    height:100svh;
    min-height:640px;
    overflow:hidden;
  }

  #sphere-canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:grab;
  }
  #sphere-canvas.dragging{cursor:grabbing}

  .caption{
    position:absolute;
    inset:auto 0 28px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    z-index:6;
    pointer-events:none;
    text-align:center;
  }
  .caption strong{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--stone-3);
  }
  .caption a{
    pointer-events:auto;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--ink);
  }

  /* visually-hidden but focusable parallel link list — canvas is aria-hidden */
  .sr-only{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  .sr-only a:focus{
    position:fixed;
    width:auto;height:auto;
    top:12px;left:12px;
    margin:0;
    padding:8px 12px;
    clip:auto;
    background:var(--ink);
    color:var(--paper);
    z-index:10;
  }

  @media (prefers-reduced-motion: reduce){
    #sphere-canvas{cursor:default}
  }
</style>
</head>
<body>

  <div class="stage">
    <header class="topbar">
      <a class="brand" href="../index.html">Monolith</a>
      <span class="tag">Experiment — drag to orbit</span>
    </header>

    <canvas id="sphere-canvas" aria-hidden="true"></canvas>

    <!-- parallel accessible list — the canvas is decorative/aria-hidden -->
    <nav class="sr-only" aria-label="Work">
      <ul id="sr-list"></ul>
    </nav>

    <div class="caption">
      <strong>24 project cards orbiting one fixed centerpiece &middot; drag, or wait for idle drift</strong>
      <a href="../index.html">&larr; back to the real homepage</a>
    </div>
  </div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

/* ---------------- placeholder "photography" ----------------
   No real portrait photography exists yet, so each orbiting card is a
   canvas-drawn near-monochrome portrait card labeled with the work item it
   stands in for. Swap makeCardTexture() for real <img> textures later —
   geometry, billboarding, and fade all stay exactly the same. */

const WORKS = [
  { title: "Estbuild",     meta: "Aithraa · Case study", href: "../work/estbuild/index.html" },
  { title: "Pinnacle AI",  meta: "Active",               href: "../index.html#work" },
  { title: "PacAR",        meta: "HCI research",         href: "../index.html#work" },
  { title: "Perplexity AI",meta: "Fellowship",           href: "../index.html#work" },
  { title: "Codexive",     meta: "Design engineer",      href: "../index.html#work" },
];

function makeCardTexture(work, tone){
  const w = 340, h = 453; // 3:4 portrait
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");

  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, tone.a);
  g.addColorStop(1, tone.b);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.beginPath();
  ctx.ellipse(w * 0.5, h * 0.38, w * 0.22, h * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = tone.text;
  ctx.textAlign = "left";
  ctx.font = "700 20px Arial";
  ctx.fillText(work.title, 18, h - 56);
  ctx.font = "500 13px Arial";
  ctx.globalAlpha = .75;
  ctx.fillText(work.meta.toUpperCase(), 18, h - 32);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const TONES = [
  { a: "#2c2b2a", b: "#6b6762", text: "#fff" },
  { a: "#d7d3cd", b: "#a9a49c", text: "#141414" },
  { a: "#141414", b: "#2c2b2a", text: "#fff" },
  { a: "#f2f0ed", b: "#d7d3cd", text: "#141414" },
  { a: "#6b6762", b: "#2c2b2a", text: "#fff" },
];

const cardTextures = WORKS.map((w, i) => makeCardTexture(w, TONES[i % TONES.length]));

/* ---------------- accessible parallel list ---------------- */
const srList = document.getElementById("sr-list");
WORKS.forEach((w) => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = w.href;
  a.textContent = `${w.title} — ${w.meta}`;
  a.addEventListener("focus", () => { dragging = false; velocity.x = velocity.y = 0; });
  li.appendChild(a);
  srList.appendChild(li);
});

/* ---------------- centerpiece: cut the white ground out of the source PNG ----------------
   human-particle.png (or whatever image is passed in) is an opaque RGB
   image with a flat white background and no alpha channel. Rendering it
   as-is would show a visible white rectangle at the sphere's core, so the
   fragment shader below turns near-white pixels transparent, keeping only
   the dark/gray marks — a silhouette floating at the center.

   Notes on how it's loaded, since both of these have bitten this file before:
   - The cutout runs in the fragment shader, sampling the texture on the GPU,
     rather than via a 2D canvas + getImageData() — that throws a
     SecurityError ("tainted canvas") once the page is opened via file://
     instead of http://.
   - Loaded via a plain <img>, not THREE.TextureLoader: the loader sets
     crossOrigin="anonymous" by default, which forces a CORS-mode fetch that
     some browsers refuse for a local file:// image with no CORS handshake
     to satisfy. A bare <img> has no such requirement.
   - Mipmaps stay on (Three.js's default). This texture is a dense field of
     tiny particle dots — disabling mipmaps makes bilinear-only minification
     alias badly, statistically oversampling the dark dots vs. the white
     gaps between them, and the figure reads far darker and noisier than the
     source image. */
function loadCutoutTexture(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const tex = new THREE.Texture(img);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      resolve({ texture: tex, aspect: img.naturalWidth / img.naturalHeight });
    };
    img.onerror = reject;
    img.src = url;
  });
}

function makeCutoutMaterial(texture) {
  return new THREE.ShaderMaterial({
    uniforms: { map: { value: texture } },
    transparent: true,
    depthWrite: false,
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D map;
      varying vec2 vUv;
      void main() {
        vec4 texel = texture2D(map, vUv);
        float luma = (texel.r + texel.g + texel.b) / 3.0;
        // 0.92..1.0 luma ramps to alpha 1..0 — mirrors the old 235..255/255 cutoff
        float alpha = 1.0 - smoothstep(0.92, 1.0, luma);
        gl_FragColor = vec4(texel.rgb, alpha);
      }
    `,
  });
}

/* ---------------- geometry: Fibonacci sphere ---------------- */
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

function fibonacciSphere(count, radius = 1) {
  const pts = [];
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const theta = GOLDEN_ANGLE * i;
    pts.push(new THREE.Vector3(Math.cos(theta) * r * radius, y * radius, Math.sin(theta) * r * radius));
  }
  return pts;
}

const R = 1, COUNT = 24, CARD_W = 0.105 * 3.2, CARD_H = 0.14 * 3.2; // scaled up for visibility at this R

const canvas = document.getElementById("sphere-canvas");
const stage = document.querySelector(".stage");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, stage.clientWidth / stage.clientHeight, 0.1, 100);
camera.position.set(0, 0, 3.25 * R);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);

/* ---- the 24 orbiting project cards ---- */
const points = fibonacciSphere(COUNT, R);
const cards = points.map((p, i) => {
  const geo = new THREE.PlaneGeometry(CARD_W, CARD_H);
  const mat = new THREE.MeshBasicMaterial({
    map: cardTextures[i % cardTextures.length],
    transparent: true,
    depthWrite: false,
    toneMapped: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(p);
  mesh.userData.basePoint = p; // orbit is applied to this each frame, not to a parent transform
  scene.add(mesh);
  return mesh;
});

/* ---- the fixed centerpiece — sits at the sphere's core, does not orbit ----
   Loaded asynchronously and added to the scene whenever it's ready, rather
   than awaited before the render loop starts below: the 24 orbiting cards
   have nothing to do with this image, and one failed image load should
   never be able to blank the entire sphere. */
let centerFigure = null;
const CENTER_H = R * 1.1;
// Embedded as a data URI rather than loaded from assets/human-particle.png:
// Safari treats a same-directory file:// image as cross-origin for WebGL
// texture purposes specifically (not for a plain <img>), which can silently
// block the texture from rendering with no console error at all. A data URI
// is inline in the document itself — there's no separate resource load for
// any browser to flag as cross-origin.
loadCutoutTexture("../assets/human-particle.png")
  .then(({ texture, aspect }) => {
    centerFigure = new THREE.Mesh(
      new THREE.PlaneGeometry(CENTER_H * aspect, CENTER_H),
      makeCutoutMaterial(texture)
    );
    centerFigure.position.set(0, 0, 0);
    scene.add(centerFigure);
  })
  .catch((err) => console.warn("center figure failed to load, skipping it:", err));

/* Cards live directly in the scene (world space), not under a rotating
   parent group. Billboarding sets each card's quaternion to the camera's
   world quaternion — if the cards were children of a rotating group, that
   group's rotation would compound with the billboard quaternion and tilt
   every card. So "orbiting the sphere" instead rotates each card's base
   point by an accumulated quaternion every frame, and billboarding stays
   a simple, uncompounded copy. The centerpiece never moves (the sphere's
   center is invariant under rotation about itself) — it only billboards. */
const rot = { x: 0, y: 0 };
const orbitQuat = new THREE.Quaternion();
const euler = new THREE.Euler();

/* ---------------- interaction: drag orbit + inertia + idle drift ---------------- */
const SENSITIVITY = 0.005;
const DAMP = 0.92;
const IDLE_SPEED = 0.0015;

let dragging = false;
let lastX = 0, lastY = 0;
const velocity = { x: 0, y: 0 };

canvas.addEventListener("pointerdown", (e) => {
  dragging = true;
  canvas.classList.add("dragging");
  canvas.setPointerCapture(e.pointerId);
  lastX = e.clientX; lastY = e.clientY;
  velocity.x = velocity.y = 0;
});

canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;

  const dyRot = dx * SENSITIVITY;
  const dxRot = dy * SENSITIVITY;
  rot.y += dyRot;
  rot.x = THREE.MathUtils.clamp(rot.x + dxRot, -Math.PI / 2, Math.PI / 2);

  velocity.y = dyRot;
  velocity.x = dxRot;
});

function endDrag() {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove("dragging");
  if (reduceMotion) { velocity.x = velocity.y = 0; }
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("pointerleave", (e) => { if (e.buttons === 0) endDrag(); });

/* ---------------- resize ---------------- */
function onResize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener("resize", onResize);

/* ---------------- render loop ---------------- */
const viewDir = new THREE.Vector3();
const worldPos = new THREE.Vector3();
const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const delta = Math.min(clock.getDelta(), 0.05);
  const damp = Math.pow(DAMP, delta * 60);

  if (!dragging) {
    velocity.x *= damp;
    velocity.y *= damp;
    if (Math.abs(velocity.x) < 1e-5) velocity.x = 0;
    if (Math.abs(velocity.y) < 1e-5) velocity.y = 0;

    rot.y += velocity.y;
    rot.x += velocity.x;

    if (!reduceMotion && velocity.x === 0 && velocity.y === 0) {
      rot.y += IDLE_SPEED * delta * 60;
    }
    rot.x = THREE.MathUtils.clamp(rot.x, -Math.PI / 2, Math.PI / 2);
  }

  euler.set(rot.x, rot.y, 0, "YXZ");
  orbitQuat.setFromEuler(euler);

  camera.getWorldDirection(viewDir);
  cards.forEach((card) => {
    worldPos.copy(card.userData.basePoint).applyQuaternion(orbitQuat);
    card.position.copy(worldPos);
    card.quaternion.copy(camera.quaternion); // billboard — uncompounded, cards are scene children
    const t = THREE.MathUtils.clamp((-worldPos.dot(viewDir) / R + 1) / 2, 0, 1);
    card.material.opacity = THREE.MathUtils.lerp(0.08, 1, t * t);
  });

  if (centerFigure) centerFigure.quaternion.copy(camera.quaternion); // billboard only — position never changes

  renderer.render(scene, camera);
}

onResize();
tick();
</script>
</body>
</html>
